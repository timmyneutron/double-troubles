<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
  </defs>

  <!-- Circular background with diagonal gradient -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGradient)" />

  <!-- D letter - blue with white border, upper-left on the diagonal -->
  <text x="70" y="210" font-family="Arial Black, Impact, sans-serif" font-size="180" font-weight="900"
        fill="#1E40AF" stroke="white" stroke-width="7" paint-order="stroke fill">D</text>

  <!-- T letter - red with white border, lower-right on the diagonal -->
  <text x="215" y="330" font-family="Arial Black, Impact, sans-serif" font-size="180" font-weight="900"
        fill="#DC2626" stroke="white" stroke-width="7" paint-order="stroke fill">T</text>
</svg>